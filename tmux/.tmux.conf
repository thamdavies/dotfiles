# Remap prefix from 'Ctrl+b' to 'Ctrl+a'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file quickly with Prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable mouse support (click panes, resize borders, scroll)
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Split panes intuitively using | and - in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Vim-style keys (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Improve colors and reduce Esc key delay (great for Vim/Neovim)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Use Vi keys in copy mode
setw -g mode-keys vi
